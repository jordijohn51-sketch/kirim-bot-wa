<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirim Bot WA</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#22c55e" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { width: 100%; max-width: 440px; background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; }
    h2 { margin: 0 0 6px; font-size: 1.15rem; }
    p { margin: 0 0 14px; font-size: 0.85rem; color: #94a3b8; }
    textarea { width: 100%; min-height: 110px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #22c55e; color: #052e16; font-weight: 700; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .log { margin-top: 14px; background: #0f172a; padding: 10px; border-radius: 10px; font-size: 0.82rem; max-height: 150px; overflow-y: auto; }
    .ok { color: #4ade80; } .err { color: #f87171; } .info { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📲 Kirim Link ke Bot WA</h2>
    <p id="subText">Otomatis menerima link dari tombol Bagikan (Share) IG & TikTok</p>
    <textarea id="links" placeholder="Link akan muncul otomatis di sini saat kamu klik Bagikan..."></textarea>
    <button id="sendBtn" onclick="kirimSemua(false)">🚀 Kirim ke Bot WA</button>
    <div class="log" id="logBox"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbztm4N6tcjpsYef6WNSF90ThrYcwUkmLMkWbybOjrUOhkBXBIsCA8-_6UIDsMPhkoTM/exec";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const linksBox = document.getElementById('links');
    const logBox = document.getElementById('logBox');
    const sendBtn = document.getElementById('sendBtn');
    const subText = document.getElementById('subText');

    function log(msg, cls = 'info') {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = `[${new Date().toLocaleTimeString('id-ID')}] ${msg}`;
      logBox.prepend(div);
    }

    function tutupOtomatis() {
      log('Selesai! Kembali ke aplikasi sebelumnya...', 'info');
      setTimeout(() => {
        window.close();
        if (window.history.length > 1) {
          window.history.back();
        }
      }, 800);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const sharedText = [params.get('url'), params.get('text'), params.get('title')].filter(Boolean).join(' ');
      
      const urlMatch = sharedText.match(/https?:\/\/[^\s]+/g);
      if (urlMatch && urlMatch.length > 0) {
        linksBox.value = urlMatch.join('\n');
        subText.textContent = "Sedang mengirim otomatis & akan menutup sendiri...";
        log('Link ditangkap! Mengirim otomatis...', 'ok');
        kirimSemua(true);
      } else {
        log('Siap menerima link. Buka IG/TikTok > Bagikan > pilih Bot WA.');
      }
    });

    async function kirimSemua(isFromShare = false) {
      const lines = linksBox.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (!lines.length) return log('Belum ada link untuk dikirim.', 'err');

      sendBtn.disabled = true;
      let allSuccess = true;

      for (let i = 0; i < lines.length; i++) {
        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({ message: lines[i] })
          });
          const data = await res.json();
          if (data.status) {
            log(`(${i + 1}/${lines.length}) Terkirim: ${lines[i]}`, 'ok');
          } else {
            allSuccess = false;
            log(`Gagal: ${data.reason || 'Error'}`, 'err');
          }
        } catch (e) {
          allSuccess = false;
          log(`Error jaringan: ${e.message}`, 'err');
        }
      }

      linksBox.value = '';
      sendBtn.disabled = false;

      if (isFromShare && allSuccess) {
        tutupOtomatis();
      }
    }
  </script>
</body>
</html>
