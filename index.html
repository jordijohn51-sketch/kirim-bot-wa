<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirim Bot WA</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#22c55e" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; }
    .card { width: 100%; max-width: 460px; background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; }
    h2 { margin: 0 0 6px; font-size: 1.2rem; }
    p { margin: 0 0 14px; font-size: 0.85rem; color: #94a3b8; }
    textarea { width: 100%; min-height: 120px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #22c55e; color: #052e16; font-weight: 700; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .log { margin-top: 14px; background: #0f172a; padding: 10px; border-radius: 10px; font-size: 0.8rem; max-height: 160px; overflow-y: auto; }
    .ok { color: #4ade80; } .err { color: #f87171; } .info { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📲 Kirim Link ke Bot WA</h2>
    <p>Otomatis menerima link dari tombol Bagikan (Share) IG & TikTok</p>
    <textarea id="links" placeholder="Link akan muncul otomatis di sini saat kamu klik Bagikan..."></textarea>
    <button id="sendBtn" onclick="kirimSemua()">🚀 Kirim ke Bot WA</button>
    <div class="log" id="logBox"></div>
  </div>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT KAMU (/exec)
    const GAS_URL = "TEMPEL_URL_APPS_SCRIPT_KAMU_DI_SINI";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const linksBox = document.getElementById('links');
    const logBox = document.getElementById('logBox');
    const sendBtn = document.getElementById('sendBtn');

    function log(msg, cls = 'info') {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = `[${new Date().toLocaleTimeString('id-ID')}] ${msg}`;
      logBox.prepend(div);
    }

    // Tangkap link otomatis saat dibagikan dari IG/TikTok
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const sharedText = [params.get('url'), params.get('text'), params.get('title')].filter(Boolean).join(' ');
      
      // Ekstrak hanya URL http/https dari teks share TikTok/IG
      const urlMatch = sharedText.match(/https?:\/\/[^\s]+/g);
      if (urlMatch && urlMatch.length > 0) {
        linksBox.value = urlMatch.join('\n');
        log('Link dari menu Bagikan berhasil ditangkap! Mengirim otomatis...', 'ok');
        kirimSemua(); // Langsung kirim otomatis begitu dibagikan!
      } else {
        log('Siap menerima link. Buka IG/TikTok > Bagikan > pilih Bot WA.');
      }
    });

    async function kirimSemua() {
      const lines = linksBox.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (!lines.length) return log('Belum ada link untuk dikirim.', 'err');

      sendBtn.disabled = true;
      for (let i = 0; i < lines.length; i++) {
        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ message: lines[i] })
          });
          const data = await res.json();
          if (data.status) {
            log(`(${i + 1}/${lines.length}) Terkirim: ${lines[i]}`, 'ok');
          } else {
            log(`Gagal: ${data.reason || 'Error'}`, 'err');
          }
        } catch (e) {
          log(`Error jaringan: ${e.message}`, 'err');
        }
      }
      linksBox.value = '';
      sendBtn.disabled = false;
    }
  </script>
</body>
</html>
